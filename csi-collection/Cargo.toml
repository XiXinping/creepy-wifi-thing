[package]
edition      = "2024"
name         = "csi-collection"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "emitter"
path = "./src/bin/emitter.rs"
test = false

[[bin]]
name = "sniffer"
path = "./src/bin/sniffer.rs"
test = false

[[bin]]
name = "station"
path = "./src/bin/station.rs"
test = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

# Exactly one chip. Build a C5 with `cargo esp32c5 ...` (see .cargo/config.toml).
[features]
default = ["esp32c6"]
esp32c5 = ["esp-alloc/esp32c5", "esp-csi-rs/esp32c5"]
esp32c6 = ["esp-alloc/esp32c6", "esp-csi-rs/esp32c6"]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
] }

esp-bootloader-esp-idf = "0.6.0"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
rtt-target = "0.6.2"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-csi-rs = { version = "0.13.0", features = ["async-print"] }
esp-println = "0.18.0"
esp-backtrace = "0.20.0"
heapless = "0.9.4"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

[dev-dependencies]
embedded-test = { version = "0.7.1", features = [
  "embassy-010",
  "external-executor",
] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
# esp-radio recommends 2 or 3: https://docs.espressif.com/projects/rust/esp-radio/0.16.0/esp32/esp_radio/index.html#:~:text=It%20is%20necessary%20to%20build%20with%20optimization%20level%202%20or%203%20since%20otherwise%2C%20it%20might%20not%20even%20be%20able%20to%20connect%20or%20advertise.
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
