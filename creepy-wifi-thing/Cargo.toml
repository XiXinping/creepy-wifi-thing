[package]
edition      = "2024"
name         = "creepy-wifi-thing"
rust-version = "1.95"
version      = "0.1.0"


[[bin]]
name = "sniffer"
path = "src/bin/sniffer.rs"
test = false

[[bin]]
name = "follower"
path = "src/bin/follower.rs"

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

[features]
default = ["esp32c5"]
esp32c5 = [
  "esp-hal/esp32c5",
  "esp-rtos/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-alloc/esp32c5",
  "esp-radio/esp32c5",
  "esp-csi-rs/esp32c5",
  "esp-backtrace/esp32c5",
  "esp-println/esp32c5",
  "dep:esp-wifi-sys-esp32c5",
]
esp32c6 = [
  "esp-hal/esp32c6",
  "esp-rtos/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-alloc/esp32c6",
  "esp-radio/esp32c6",
  "esp-csi-rs/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-println/esp32c6",
  "dep:esp-wifi-sys-esp32c6",
]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = "0.6.0"

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
rtt-target = { version = "0.6.2", features = ["defmt"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.9.0"
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = [
  "esp-alloc",
  "unstable",
  "wifi",
] }
esp-wifi-sys-esp32c5 = { version = "0.3.0", optional = true }
esp-wifi-sys-esp32c6 = { version = "0.3.0", optional = true }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
trouble-host = { version = "0.7.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-csi-rs = { version = "0.13.0", features = ["async-print"] }
portable-atomic = "1.15.0"
esp-backtrace = "0.20.0"
esp-println = "0.18.0"
defmt-rtt = "1.3.1"
heapless = "0.9.3"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

[dev-dependencies]
embedded-test = { version = "0.7.1", features = [
  "defmt",
  "embassy-010",
  "external-executor",
] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
