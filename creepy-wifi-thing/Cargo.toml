[package]
edition      = "2024"
name         = "creepy-wifi-thing"
rust-version = "1.95"
version      = "0.1.0"


[[bin]]
name = "leader"
path = "src/bin/leader.rs"
test = false

[[bin]]
name = "follower"
path = "src/bin/follower.rs"

[[bin]]
name = "emitter"
path = "src/bin/emitter.rs"
test = false

[[bin]]
name = "sniffer"
path = "src/bin/sniffer.rs"


[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }

embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }

esp-alloc = { version = "0.11.0", features = ["esp32c6"] }

# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.0" }

esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }

smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

trouble-host = { version = "0.7.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

esp-csi-rs = { version = "0.13.0", default-features = false, features = [
  "esp32c6",
  "no-std",
  "println",
  "auto",
] }
portable-atomic = "1.15.0"

esp-backtrace = { version = "0.20.0", default-features = false, features = [
  "esp32c6",
  "println",
  "panic-handler",
] }

heapless = "0.9.3"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

esp-println = { version = "0.18.0", default-features = false, features = ["esp32c6"] }

[dev-dependencies]
embedded-test = { version = "0.7.1", features = [
  "embassy-010",
  "external-executor",
] }
# "defmt" removed

[profile.dev]
opt-level = "s"

[profile.dev.package."*"]
opt-level = "s"        # optional, matches the CLI: deps are on the CSI hot path

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
